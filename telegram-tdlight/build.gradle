plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jlleitschuh.gradle.ktlint'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
    maven { url 'https://mvn.mchv.eu/repository/mchv/'; content { includeGroup 'it.tdlight' } }
}

sourceSets { main.kotlin.srcDirs += 'src/main/java' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
kotlin { jvmToolchain(17) }

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'org.slf4j:slf4j-api:2.0.17'

    implementation platform('it.tdlight:tdlight-java-bom:3.5.9+td.1.8.68')
    implementation 'it.tdlight:tdlight-java'
    runtimeOnly group: 'it.tdlight', name: 'tdlight-natives', classifier: 'linux_arm64_gnu_ssl3'
    runtimeOnly group: 'it.tdlight', name: 'tdlight-natives', classifier: 'windows_amd64'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.17.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

ktlint { version = "1.0.1" }
