// Offline regression check of the real deployment command builders.
// Invoke with -I deploy/test-deployment-policy.init.gradle testDeploymentPolicy,
// dummy piUser/piHost and mtprotoDeployment=true, then false. No Exec action runs.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.tasks.register('testDeploymentPolicy') {
        group = 'verification'
        doLast {
            def mtproto = project.providers.gradleProperty('mtprotoDeployment').orElse('false').get() == 'true'
            def command = { String name ->
                def task = project.tasks.getByName(name)
                assert task instanceof Exec
                // Only evaluate the doFirst builder, never the Exec task action or dependencies.
                task.actions.first().execute(task)
                assert task.commandLine.first() == 'ssh'
                task.commandLine.last().toString()
            }
            // Inspect local builders without running Docker/SCP or their dependencies.
            def localCommand = { String name ->
                def task = project.tasks.getByName(name)
                task.actions.first().execute(task)
                task.commandLine.collect { it.toString() }
            }
            def compose = localCommand('deployValidateCompose')
            assert compose.take(2) == ['docker', 'compose']
            assert compose[compose.indexOf('--project-directory') + 1] == project.projectDir.absolutePath
            assert compose[compose.indexOf('--env-file') + 1] == project.file('.env').absolutePath
            assert compose.contains('deploy/docker-compose.yml')
            assert compose.contains('deploy/docker-compose.mtproto.yml') == mtproto
            assert compose.takeRight(2) == ['config', '--quiet']
            def image = localCommand('deployDockerBuildImage')
            assert image[image.indexOf('-f') + 1] == 'deploy/Dockerfile'
            assert image.last() == '.'
            def platform = project.providers.gradleProperty('dockerPlatform').orElse('').get()
            if (platform) {
                assert image.take(3) == ['docker', 'buildx', 'build']
                assert image[image.indexOf('--platform') + 1] == platform
                assert image.contains('--load')
            } else {
                assert image.take(2) == ['docker', 'build']
            }
            assert project.tasks.deployDockerBuildImage.workingDir == project.projectDir
            def target = project.providers.gradleProperty('piUser').get() + '@' + project.providers.gradleProperty('piHost').get() + ':' + project.providers.gradleProperty('piDir').orElse('/opt/telegram-home-bot').get()
            def baseUpload = localCommand('deploySendCompose')
            assert baseUpload == ['scp', 'deploy/docker-compose.yml', target + '/docker-compose.yml.new']
            def overrideUpload = localCommand('deploySendMtprotoCompose')
            assert overrideUpload == ['scp', 'deploy/docker-compose.mtproto.yml', target + '/docker-compose.mtproto.yml.new']
            def remoteCheck = command('deployValidateRemote')
            assert remoteCheck.contains('Remote TELEGRAM_TRANSPORT does not match')
            assert remoteCheck.contains(mtproto ? "' 'mtproto' '" : "' 'bot-api' '")
            def scripts = [deployValidateRemote: remoteCheck]
            ['deployUp', 'deployRestart'].each { name ->
                def script = command(name)
                scripts[name] = script
                if (mtproto) {
                    assert script.contains('JAR-only rollback is disabled')
                    assert !script.contains('cp -f '): 'MTProto failure must never restore a JAR under incompatible runtime settings'
                } else {
                    assert script.contains('cp -f '): 'Preserve the Bot API rollback'
                    assert script.contains('Remote TELEGRAM_TRANSPORT does not match'): 'Rollback must verify remote transport'
                }
            }
            if (mtproto) {
                try {
                    command('deployRollback')
                    throw new AssertionError('MTProto manual JAR rollback was not refused')
                } catch (GradleException expected) {
                    assert expected.message.contains('JAR-only rollback is disabled')
                }
            } else {
                def rollback = command('deployRollback')
                scripts.deployRollback = rollback
                assert rollback.indexOf('Remote TELEGRAM_TRANSPORT does not match') < rollback.indexOf('cp -f ')
            }
            scripts.deployValidateCandidate = command('deployValidateCandidate')
            assert scripts.deployValidateCandidate.contains('docker-compose.yml.new')
            assert !scripts.deployValidateCandidate.contains('mv -f ')
            ['deployInstallEnv', 'deployInstallCompose'].each { name ->
                assert project.tasks.getByName(name).dependsOn.contains('deployValidateCandidate')
            }
            assert project.tasks.deployInstallJar.dependsOn.contains('deployValidateRemote')
            assert project.tasks.deployValidateRemote.dependsOn.contains('deployInstallCompose')
            def output = project.layout.buildDirectory.file("deployment-policy-${mtproto}.json").get().asFile
            output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.toJson(scripts)
            println "PASS: deployment command policy (mtproto=${mtproto}); no SSH/SCP/Docker operations executed"
        }
    }
}
