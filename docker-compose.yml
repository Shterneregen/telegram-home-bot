services:
  thb:
    image: ${THB_IMAGE:-thb-image:latest}
    container_name: thb
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    env_file:
      - ${THB_ENV_FILE:-.env}
    volumes:
      - ${THB_APP_DIR:-/opt/telegram-home-bot}/thb.jar:/app/app.jar:ro
      - ${THB_DATA_DIR:-/var/lib/telegram-home-bot}:/app/data
      - ${THB_CONFIG_DIR:-/etc/telegram-home-bot}/secrets:/app/secrets:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          protocol=http;
          if [ "$${SSL_ENABLED:-false}" = "true" ]; then protocol=https; fi;
          curl -fkSs "$${protocol}://127.0.0.1:$${SERVER_PORT:-9988}/actuator/health"
          | grep -q UP
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
