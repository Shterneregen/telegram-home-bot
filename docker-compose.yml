services:
  thb:
    image: thb-image:latest
    container_name: thb
    restart: always
    network_mode: host
    working_dir: /app
    env_file: .env
    environment:
      DB_URL: ${DB_URL:-jdbc:h2:/app/data/thb}
    volumes:
      - ./thb.jar:/app/app.jar:ro
      - ./data:/app/data
    entrypoint: ["java", "-jar", "/app/app.jar"]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'java -jar /app/app.jar' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
