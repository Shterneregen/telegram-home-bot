// Telegram Home Bot — Gradle Deployment Automation

def deployProperty = { String name, String defaultValue ->
    providers.gradleProperty(name).orElse(defaultValue)
}

def imageName = deployProperty("imageName", "thb-image:latest")
def piUser = deployProperty("piUser", "master")
def piHost = deployProperty("piHost", "192.168.1.15")
def piDir = deployProperty("piDir", "/home/master/telegram-home-bot")
def dockerComposeCommand = deployProperty("dockerComposeCommand", "docker compose")
def dockerPlatform = deployProperty("dockerPlatform", "")
def healthWaitSeconds = deployProperty("healthWaitSeconds", "120")

def bootJarTask = tasks.named("bootJar")
def jarFileProvider = bootJarTask.flatMap { it.archiveFile }
def imageTarProvider = layout.buildDirectory.file("deploy/thb-image.tar")

def remoteHostProvider = piUser.zip(piHost) { user, host ->
    "${user}@${host}"
}

def remoteDeployPath = { String fileName ->
    piDir.map { dir -> "${dir}/${fileName}" }
}

def remoteDeployTarget = { String fileName ->
    remoteHostProvider.zip(remoteDeployPath(fileName)) { remoteHost, remotePath ->
        "${remoteHost}:${remotePath}"
    }
}

def remoteWorkingDirectory = {
    "cd '${piDir.get().replace("'", "'\\''")}'"
}

def waitForHealthyCommand = {
    def attempts = Math.max(1, (healthWaitSeconds.get().toInteger() + 1).intdiv(2))
    "attempts=${attempts}; " +
            "while [ \"\$attempts\" -gt 0 ]; do " +
            "status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' thb 2>/dev/null || true); " +
            "if [ \"\$status\" = healthy ]; then exit 0; fi; " +
            "if [ \"\$status\" = unhealthy ]; then exit 1; fi; " +
            "attempts=\$((attempts - 1)); sleep 2; " +
            "done; exit 1"
}

gradle.taskGraph.whenReady { graph ->
    def hasDeploymentTask = graph.allTasks.any { it.group == "deployment" }
    if (hasDeploymentTask && JavaVersion.current() != JavaVersion.VERSION_17) {
        throw new GradleException(
                "Deployment tasks require Gradle to run on JDK 17. " +
                        "Current JVM: ${System.getProperty('java.version')}. Set JAVA_HOME to JDK 17."
        )
    }
}

// Local validation

tasks.register("deployValidateEnv") {
    group = "deployment"
    description = "Validate required deployment values in the local .env file"

    doLast {
        def envFile = file(".env")
        if (!envFile.isFile()) {
            throw new GradleException(".env does not exist. Copy .env.example and configure it.")
        }

        def values = [:]
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
                def separator = trimmed.indexOf("=")
                def key = trimmed.substring(0, separator).trim()
                def value = trimmed.substring(separator + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                values[key] = value
            }
        }

        def requireValue = { String key ->
            if (!values[key]) {
                throw new GradleException("${key} must be set in .env")
            }
        }

        def dbUrl = values["DB_URL"] ?: "jdbc:h2:/app/data/thb"
        if (!dbUrl.startsWith("jdbc:h2:/app/data/")) {
            throw new GradleException("DB_URL must point inside /app/data so the H2 database is persistent: ${dbUrl}")
        }

        if (values["TELEGRAM_ENABLED"]?.equalsIgnoreCase("true")) {
            requireValue("TELEGRAM_TOKEN")
            requireValue("TELEGRAM_BOT_CHAT_ID")
        }
        if (values["OPENWEATHER_ENABLED"]?.equalsIgnoreCase("true")) {
            requireValue("OPENWEATHER_APPID")
        }
        if (values["SSL_ENABLED"]?.equalsIgnoreCase("true")) {
            requireValue("SSL_KEY_STORE_PASSWORD")
            requireValue("SSL_SECRETS_HOST_PATH")
            if (!values["SSL_KEY_STORE"]?.startsWith("file:/app/secrets/")) {
                throw new GradleException(
                        "SSL_KEY_STORE must point inside file:/app/secrets/"
                )
            }
        }
    }
}

tasks.register("deployValidateCompose", Exec) {
    group = "deployment"
    description = "Validate docker-compose.yml with the local .env file"
    dependsOn "deployValidateEnv"
    commandLine "docker", "compose", "config", "--quiet"
}

// Docker image tasks

tasks.register("deployDockerBuildImage", Exec) {
    group = "deployment"
    description = "Build Docker image. Use -PdockerPlatform=linux/arm64 for Raspberry Pi ARM64."

    doFirst {
        def platform = dockerPlatform.get()

        if (platform.isEmpty()) {
            commandLine "docker", "build",
                    "-t", imageName.get(),
                    "."
        } else {
            commandLine "docker", "buildx", "build",
                    "--platform", platform,
                    "-t", imageName.get(),
                    "--load",
                    "."
        }
    }
}

tasks.register("deployDockerSaveImage", Exec) {
    group = "deployment"
    description = "Save Docker image as build/deploy/thb-image.tar"

    dependsOn "deployDockerBuildImage"

    doFirst {
        def imageTarFile = imageTarProvider.get().asFile
        imageTarFile.parentFile.mkdirs()

        commandLine "docker", "save",
                imageName.get(),
                "-o", imageTarFile.absolutePath
    }
}

// Remote preparation

tasks.register("deployPrepareRemote", Exec) {
    group = "deployment"
    description = "Create deployment directory on Raspberry Pi"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "mkdir -p '${piDir.get()}' '${piDir.get()}/data' '${piDir.get()}/secrets'"
    }
}

// SCP transfer tasks

tasks.register("deploySendJar", Exec) {
    group = "deployment"
    description = "SCP jar to Raspberry Pi"

    dependsOn bootJarTask, "deployPrepareRemote"

    doFirst {
        commandLine "scp",
                jarFileProvider.get().asFile.absolutePath,
                remoteDeployTarget("thb.jar.new").get()
    }
}

tasks.register("deployInstallJar", Exec) {
    group = "deployment"
    description = "Atomically install the uploaded jar and keep thb.jar.bak"

    dependsOn "deploySendJar", "deployValidateRemote"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "${remoteWorkingDirectory()} && " +
                        "test -s thb.jar.new && " +
                        "if [ -f thb.jar ]; then cp -f thb.jar thb.jar.bak; fi && " +
                        "mv -f thb.jar.new thb.jar"
    }
}

tasks.register("deploySendImage", Exec) {
    group = "deployment"
    description = "SCP Docker image tar to Raspberry Pi"

    dependsOn "deployDockerSaveImage", "deployPrepareRemote"

    doFirst {
        commandLine "scp",
                imageTarProvider.get().asFile.absolutePath,
                remoteDeployTarget("thb-image.tar").get()
    }
}

tasks.register("deploySendCompose", Exec) {
    group = "deployment"
    description = "SCP docker-compose.yml to Raspberry Pi"

    dependsOn "deployPrepareRemote"

    doFirst {
        commandLine "scp",
                "docker-compose.yml",
                remoteDeployTarget("docker-compose.yml").get()
    }
}

tasks.register("deploySendEnv", Exec) {
    group = "deployment"
    description = "SCP .env to Raspberry Pi. Requires -PsendEnv=true."

    dependsOn "deployPrepareRemote"

    onlyIf {
        providers.gradleProperty("sendEnv").orElse("false").get() == "true"
    }

    doFirst {
        if (!file(".env").isFile()) {
            throw new GradleException(".env does not exist. Create it locally or remove -PsendEnv=true.")
        }

        commandLine "scp",
                ".env",
                remoteDeployTarget(".env").get()
    }
}

tasks.register("deployValidateRemote", Exec) {
    group = "deployment"
    description = "Validate remote .env, persistent database path, TLS keystore, and Compose configuration"

    dependsOn "deployPrepareRemote", "deploySendCompose", "deploySendEnv"

    doFirst {
        def readEnvFunction =
                "read_env() { grep -E \"^\$1=\" .env | tail -n 1 | cut -d= -f2- | tr -d '\"\\r'; }; "
        def validation =
                "db_url=\$(read_env DB_URL); " +
                        "case \"\${db_url:-jdbc:h2:/app/data/thb}\" in jdbc:h2:/app/data/*) ;; " +
                        "*) echo 'DB_URL must point inside /app/data' >&2; exit 1 ;; esac; " +
                        "ssl_enabled=\$(read_env SSL_ENABLED); " +
                        "if [ \"\${ssl_enabled:-false}\" = true ]; then " +
                        "key_store=\$(read_env SSL_KEY_STORE); " +
                        "secrets_host=\$(read_env SSL_SECRETS_HOST_PATH); " +
                        "case \"\$key_store\" in file:/app/secrets/*) ;; " +
                        "*) echo 'SSL_KEY_STORE must point inside /app/secrets' >&2; exit 1 ;; esac; " +
                        "key_store_name=\${key_store#file:/app/secrets/}; " +
                        "[ -n \"\$secrets_host\" ] && [ -f \"\$secrets_host/\$key_store_name\" ] || " +
                        "{ echo 'TLS keystore configuration is invalid or the host file is missing' >&2; exit 1; }; " +
                        "fi"

        commandLine "ssh",
                remoteHostProvider.get(),
                "${remoteWorkingDirectory()} && test -f .env && " +
                        readEnvFunction + validation + " && ${dockerComposeCommand.get()} config --quiet"
    }
}

// SSH lifecycle tasks

tasks.register("deployUp", Exec) {
    group = "deployment"
    description = "Load Docker image and start container on Raspberry Pi"

    dependsOn "deploySendImage",
            "deploySendCompose",
            "deployInstallJar",
            "deployValidateRemote",
            "deployValidateCompose"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "${remoteWorkingDirectory()} && " +
                        "test -f .env && test -s thb.jar && test -s thb-image.tar && " +
                        "docker load -i thb-image.tar && " +
                        "${dockerComposeCommand.get()} config --quiet && " +
                        "${dockerComposeCommand.get()} up -d --force-recreate && " +
                        "(${waitForHealthyCommand()}) || " +
                        "(if [ -s thb.jar.bak ]; then cp -f thb.jar.bak thb.jar && " +
                        "${dockerComposeCommand.get()} up -d --force-recreate && " +
                        "(${waitForHealthyCommand()}); fi; exit 1)"
    }
}

tasks.register("deployRestart", Exec) {
    group = "deployment"
    description = "Recreate container, verify health, and rollback the jar on failure"

    dependsOn "deployInstallJar", "deployValidateRemote"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "${remoteWorkingDirectory()} && " +
                        "test -f .env && ${dockerComposeCommand.get()} config --quiet && " +
                        "${dockerComposeCommand.get()} up -d --force-recreate && " +
                        "(${waitForHealthyCommand()}) || " +
                        "(test -s thb.jar.bak && cp -f thb.jar.bak thb.jar && " +
                        "${dockerComposeCommand.get()} up -d --force-recreate && " +
                        "(${waitForHealthyCommand()}); exit 1)"
    }
}

tasks.register("deployLogs", Exec) {
    group = "deployment"
    description = "Stream container logs from Raspberry Pi"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "cd ${piDir.get()} && ${dockerComposeCommand.get()} logs -f"
    }
}

tasks.register("deployStop", Exec) {
    group = "deployment"
    description = "Stop container on Raspberry Pi"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "cd ${piDir.get()} && ${dockerComposeCommand.get()} down"
    }
}

tasks.register("deployStatus", Exec) {
    group = "deployment"
    description = "Check container status on Raspberry Pi"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "cd ${piDir.get()} && ${dockerComposeCommand.get()} ps"
    }
}

// Aggregate tasks

tasks.register("firstDeploy") {
    group = "deployment"
    description = "First deploy: build image + jar, send files to Pi, load image, start container"

    dependsOn "deployUp"
}

tasks.register("redeploy") {
    group = "deployment"
    description = "Daily update: build jar, send to Pi, restart container"

    dependsOn "deployRestart"
}

tasks.register("deployRollback", Exec) {
    group = "deployment"
    description = "Rollback previous jar on Raspberry Pi"

    doFirst {
        commandLine "ssh",
                remoteHostProvider.get(),
                "${remoteWorkingDirectory()} && " +
                        "test -s thb.jar.bak && cp -f thb.jar.bak thb.jar && " +
                        "${dockerComposeCommand.get()} up -d --force-recreate && " +
                        "(${waitForHealthyCommand()})"
    }
}
